  <rect x="170" y="150" width="1580" height="760" rx="24" fill="url(#glass)" />

  <circle cx="210" cy="182" r="8" fill="#ff5f57" />
  <circle cx="236" cy="182" r="8" fill="#febb2e" />
  <circle cx="262" cy="182" r="8" fill="#28c840" />

