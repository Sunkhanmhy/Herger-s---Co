<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Macbook briefing suite preview</title>
  <desc id="desc">Macbook styled legal briefing workspace with synchronized case notes and research feed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1f44" />
      <stop offset="100%" stop-color="#1f3d76" />
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#edf2fa" stop-opacity="0.96" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <circle cx="1620" cy="220" r="220" fill="#b8860b" fill-opacity="0.2" />
  <circle cx="250" cy="850" r="260" fill="#132a56" fill-opacity="0.45" />

