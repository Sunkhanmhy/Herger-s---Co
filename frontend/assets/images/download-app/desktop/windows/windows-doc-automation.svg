<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Windows document automation preview</title>
  <desc id="desc">Desktop automation layout showing templates, approvals and secure signing workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#081b3c" />
      <stop offset="100%" stop-color="#133b77" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2fa" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <circle cx="1700" cy="870" r="220" fill="#b8860b" fill-opacity="0.2" />

  <rect x="120" y="90" width="1680" height="900" rx="28" fill="#071735" stroke="#d6ddec" stroke-opacity="0.4" stroke-width="5" />
  <rect x="150" y="140" width="1620" height="810" rx="22" fill="url(#panel)" />

  <text x="220" y="250" fill="#132a56" font-size="52" font-family="Inter, Arial, sans-serif" font-weight="800">Document Automation Studio</text>
  <text x="220" y="304" fill="#4b679f" font-size="30" font-family="Inter, Arial, sans-serif">Windows workflow built for legal drafting and approvals</text>

  <rect x="220" y="350" width="500" height="520" rx="24" fill="#132a56" />
  <text x="260" y="418" fill="#f4e2b8" font-size="33" font-family="Inter, Arial, sans-serif" font-weight="700">Template Library</text>
  <rect x="260" y="452" width="420" height="76" rx="14" fill="#1f3d76" />
  <text x="292" y="500" fill="#d6ddec" font-size="25" font-family="Inter, Arial, sans-serif">Share Purchase Agreement</text>
  <rect x="260" y="542" width="420" height="76" rx="14" fill="#1f3d76" />
  <text x="292" y="590" fill="#d6ddec" font-size="25" font-family="Inter, Arial, sans-serif">Board Resolution Pack</text>
  <rect x="260" y="632" width="420" height="76" rx="14" fill="#b8860b" />
  <text x="292" y="680" fill="#fff" font-size="25" font-family="Inter, Arial, sans-serif" font-weight="700">Tax Position Memo</text>

  <rect x="760" y="350" width="480" height="245" rx="20" fill="#ffffff" />
  <text x="794" y="414" fill="#132a56" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700">Approvals</text>
  <text x="794" y="470" fill="#4b679f" font-size="25" font-family="Inter, Arial, sans-serif">8 partners awaiting sign-off</text>
  <rect x="794" y="505" width="260" height="58" rx="14" fill="#b8860b" />
  <text x="848" y="543" fill="#fff" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Review Queue</text>

  <rect x="1260" y="350" width="480" height="245" rx="20" fill="#ffffff" />
  <text x="1294" y="414" fill="#132a56" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700">Secure Signing</text>
  <text x="1294" y="470" fill="#4b679f" font-size="25" font-family="Inter, Arial, sans-serif">Time-stamped and tamper-evident</text>
  <rect x="1294" y="505" width="260" height="58" rx="14" fill="#132a56" />
  <text x="1340" y="543" fill="#f4e2b8" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Open Sign Room</text>

  <rect x="760" y="625" width="980" height="245" rx="20" fill="#ffffff" />
  <text x="794" y="690" fill="#132a56" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Workflow Timeline</text>
  <line x1="808" y1="754" x2="1688" y2="754" stroke="#d6ddec" stroke-width="8" />
  <circle cx="870" cy="754" r="19" fill="#b8860b" />
  <circle cx="1070" cy="754" r="19" fill="#b8860b" />
  <circle cx="1270" cy="754" r="19" fill="#b8860b" />
  <circle cx="1470" cy="754" r="19" fill="#1f3d76" />
  <circle cx="1670" cy="754" r="19" fill="#1f3d76" />
</svg>
