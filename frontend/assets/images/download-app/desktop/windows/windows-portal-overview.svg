  <text x="600" y="302" fill="#4b679f" font-size="29" font-family="Inter, Arial, sans-serif">Multi-window productivity for legal teams</text>

  <rect x="600" y="340" width="350" height="180" rx="18" fill="#ffffff" />
  <text x="632" y="408" fill="#132a56" font-size="29" font-family="Inter, Arial, sans-serif" font-weight="700">Active Matters</text>
  <text x="632" y="478" fill="#0a1f44" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">318</text>

  <rect x="980" y="340" width="350" height="180" rx="18" fill="#132a56" />
  <text x="1012" y="408" fill="#f4e2b8" font-size="29" font-family="Inter, Arial, sans-serif" font-weight="700">Pending Reviews</text>
  <text x="1012" y="478" fill="#fff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">47</text>

  <rect x="1360" y="340" width="350" height="180" rx="18" fill="#b8860b" />
  <text x="1392" y="408" fill="#0a1f44" font-size="29" font-family="Inter, Arial, sans-serif" font-weight="700">Urgent Deadlines</text>
  <text x="1392" y="478" fill="#fff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">09</text>

  <rect x="600" y="550" width="700" height="320" rx="22" fill="#ffffff" />
  <text x="632" y="615" fill="#132a56" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Team Throughput (30 days)</text>
