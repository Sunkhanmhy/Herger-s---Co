  <line x1="642" y1="826" x2="1268" y2="826" stroke="#d6ddec" stroke-width="5" />

  <rect x="1330" y="550" width="380" height="320" rx="22" fill="#ffffff" />
  <text x="1362" y="615" fill="#132a56" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Alerts</text>
