<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Windows portal overview</title>
  <desc id="desc">Desktop portal interface for Windows showing legal workflow metrics and case timelines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1f44" />
      <stop offset="100%" stop-color="#224b8c" />
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fefefe" />
      <stop offset="100%" stop-color="#edf2fa" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <circle cx="1620" cy="230" r="200" fill="#b8860b" fill-opacity="0.2" />
  <circle cx="210" cy="900" r="300" fill="#1f3d76" fill-opacity="0.35" />

  <rect x="150" y="90" width="1620" height="900" rx="30" fill="#071735" stroke="#d6ddec" stroke-opacity="0.45" stroke-width="5" />
  <rect x="180" y="140" width="1560" height="810" rx="24" fill="url(#frame)" />

  <rect x="220" y="190" width="330" height="710" rx="20" fill="#0a1f44" />
  <text x="260" y="260" fill="#f4e2b8" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Matter Desk</text>
  <rect x="255" y="302" width="260" height="12" rx="6" fill="#d6ddec" fill-opacity="0.5" />
  <rect x="255" y="362" width="240" height="58" rx="12" fill="#b8860b" />
  <text x="285" y="400" fill="#fff" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">Dashboard</text>
  <rect x="255" y="446" width="240" height="58" rx="12" fill="#132a56" />
  <text x="285" y="484" fill="#d6ddec" font-size="24" font-family="Inter, Arial, sans-serif">Case Rooms</text>
  <rect x="255" y="530" width="240" height="58" rx="12" fill="#132a56" />
  <text x="285" y="568" fill="#d6ddec" font-size="24" font-family="Inter, Arial, sans-serif">Court Calendar</text>

