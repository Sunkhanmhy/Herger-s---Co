<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2160" role="img" aria-labelledby="title desc">
  <title id="title">Android dashboard preview</title>
  <desc id="desc">A modern Android app dashboard interface with legal brief cards and performance charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071735" />
      <stop offset="100%" stop-color="#133b77" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#eef2f9" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#e0b44a" />
    </linearGradient>
  </defs>
  <rect width="1080" height="2160" fill="url(#bg)" />
  <circle cx="170" cy="260" r="210" fill="#b8860b" fill-opacity="0.2" />
  <circle cx="950" cy="540" r="280" fill="#e0b44a" fill-opacity="0.15" />

  <rect x="180" y="110" width="720" height="1940" rx="86" fill="#0a1f44" stroke="#d6ddec" stroke-opacity="0.35" stroke-width="8" />
  <rect x="205" y="205" width="670" height="1760" rx="54" fill="url(#card)" />

  <rect x="255" y="300" width="570" height="90" rx="24" fill="#f4e2b8" />
  <text x="285" y="358" fill="#0a1f44" font-size="38" font-family="Inter, Arial, sans-serif" font-weight="700">Herger Client App</text>

  <rect x="255" y="430" width="570" height="230" rx="30" fill="#ffffff" />
  <text x="285" y="505" fill="#132a56" font-size="42" font-family="Inter, Arial, sans-serif" font-weight="700">Today</text>
  <text x="285" y="565" fill="#3a5a9a" font-size="30" font-family="Inter, Arial, sans-serif">2 meetings, 1 filing deadline</text>
  <rect x="285" y="598" width="260" height="18" rx="9" fill="url(#accent)" />

  <rect x="255" y="700" width="270" height="290" rx="24" fill="#132a56" />
  <text x="285" y="782" fill="#f4e2b8" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">Cases</text>
  <text x="285" y="870" fill="#ffffff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">124</text>
  <text x="285" y="920" fill="#d6ddec" font-size="24" font-family="Inter, Arial, sans-serif">active records</text>

  <rect x="555" y="700" width="270" height="290" rx="24" fill="#b8860b" />
  <text x="585" y="782" fill="#0a1f44" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">Tasks</text>
  <text x="585" y="870" fill="#ffffff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">39</text>
  <text x="585" y="920" fill="#fbf3e0" font-size="24" font-family="Inter, Arial, sans-serif">priority actions</text>

  <rect x="255" y="1040" width="570" height="410" rx="30" fill="#ffffff" />
  <text x="285" y="1112" fill="#132a56" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Matter Performance</text>
  <polyline points="285,1320 360,1270 430,1315 500,1180 570,1210 640,1120 710,1168 780,1080" fill="none" stroke="#b8860b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="285" y1="1365" x2="780" y2="1365" stroke="#d6ddec" stroke-width="6" />

  <rect x="255" y="1490" width="570" height="250" rx="28" fill="#132a56" />
  <text x="285" y="1562" fill="#f4e2b8" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700">Upload Case Evidence</text>
  <text x="285" y="1615" fill="#d6ddec" font-size="27" font-family="Inter, Arial, sans-serif">Scan and sync files to your legal room.</text>
  <rect x="285" y="1652" width="220" height="58" rx="16" fill="#b8860b" />
  <text x="328" y="1690" fill="#ffffff" font-size="26" font-family="Inter, Arial, sans-serif" font-weight="700">Open Tool</text>
</svg>
