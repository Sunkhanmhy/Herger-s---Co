<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2160" role="img" aria-labelledby="title desc">
  <title id="title">Android security center preview</title>
  <desc id="desc">A secure Android mobile layout showing privacy controls, alerts and activity timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#030d1f" />
      <stop offset="100%" stop-color="#0a1f44" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f4fb" />
    </linearGradient>
  </defs>
  <rect width="1080" height="2160" fill="url(#bg)" />
  <circle cx="880" cy="250" r="230" fill="#b8860b" fill-opacity="0.18" />
  <circle cx="120" cy="1780" r="300" fill="#1f3d76" fill-opacity="0.35" />

  <rect x="180" y="110" width="720" height="1940" rx="86" fill="#091c3f" stroke="#8ca0c8" stroke-opacity="0.4" stroke-width="8" />
