  <text x="285" y="1066" fill="#132a56" font-size="31" font-family="Inter, Arial, sans-serif" font-weight="700">Location-safe sessions</text>
  <rect x="670" y="1040" width="120" height="58" rx="29" fill="#b8860b" />
