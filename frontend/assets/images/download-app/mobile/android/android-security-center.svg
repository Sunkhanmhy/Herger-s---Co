  <text x="460" y="586" fill="#f4e2b8" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700">End-to-End Protection</text>
  <text x="460" y="637" fill="#d6ddec" font-size="24" font-family="Inter, Arial, sans-serif">Document vault and session audit are active.</text>

  <rect x="255" y="810" width="570" height="155" rx="24" fill="#ffffff" />
  <text x="285" y="876" fill="#132a56" font-size="31" font-family="Inter, Arial, sans-serif" font-weight="700">Biometric unlock</text>
