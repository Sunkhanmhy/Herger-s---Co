<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" role="img" aria-labelledby="title desc">
  <title id="title">iOS client app preview</title>
  <desc id="desc">Two overlapping iPhone mockups showing the Herger's &amp; Co. client app: consultation booking, profile dashboard, support tickets, IT support status and an in-progress conference call.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#091c3f" />
      <stop offset="100%" stop-color="#224b8c" />
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fafbfd" />
      <stop offset="100%" stop-color="#edf2fa" />
    </linearGradient>
    <linearGradient id="pill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#d9a83b" />
    </linearGradient>
  </defs>
  <rect width="1080" height="960" fill="url(#bg)" />
  <circle cx="960" cy="800" r="190" fill="#b8860b" fill-opacity="0.18" />
  <circle cx="140" cy="180" r="160" fill="#ffffff" fill-opacity="0.07" />

  <!-- ===================== Phone A (back / left): dashboard ===================== -->
  <rect x="40" y="36" width="520" height="866" rx="88" fill="#0a1f44" stroke="#d6ddec" stroke-opacity="0.42" stroke-width="8" />
  <rect x="64" y="88" width="472" height="760" rx="48" fill="url(#screen)" />

  <!-- Status bar: Dynamic-Island notch + clock + signal/wifi/battery -->
  <rect x="255" y="52" width="90" height="24" rx="12" fill="#000000" />
  <text x="84" y="146" fill="#132a56" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">9:41</text>
  <rect x="432" y="134" width="7" height="14" rx="2" fill="#132a56" />
  <rect x="443" y="128" width="7" height="20" rx="2" fill="#132a56" />
  <rect x="454" y="122" width="7" height="26" rx="2" fill="#132a56" />
  <path d="M470 146 q14 -20 28 0" stroke="#132a56" stroke-width="5" fill="none" stroke-linecap="round" />
  <rect x="496" y="128" width="32" height="17" rx="4" fill="none" stroke="#132a56" stroke-width="3" />
  <rect x="499" y="131" width="24" height="11" rx="2" fill="#132a56" />
  <rect x="530" y="133" width="4" height="7" rx="2" fill="#132a56" />

  <!-- Header: profile dashboard -->
  <circle cx="104" cy="200" r="22" fill="url(#pill)" />
  <text x="104" y="207" fill="#0a1f44" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">AO</text>
  <text x="138" y="195" fill="#132a56" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Hello, Adaeze</text>
  <text x="138" y="219" fill="#5a77b3" font-size="15" font-family="Inter, Arial, sans-serif">Corporate Client</text>

  <!-- Card: book / upcoming consultation session -->
  <rect x="84" y="250" width="432" height="160" rx="24" fill="#ffffff" stroke="#d6ddec" stroke-width="2" />
  <text x="104" y="283" fill="#132a56" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700">Upcoming Consultation</text>
  <rect x="104" y="295" width="26" height="22" rx="5" fill="none" stroke="#b8860b" stroke-width="3" />
  <line x1="104" y1="303" x2="130" y2="303" stroke="#b8860b" stroke-width="2" />
  <text x="140" y="313" fill="#3a5a9a" font-size="14" font-family="Inter, Arial, sans-serif">Mon, 14 Oct &#8226; 10:30 AM</text>
  <text x="104" y="340" fill="#3a5a9a" font-size="14" font-family="Inter, Arial, sans-serif">Partner: B. Herger &#8212; Case Review</text>
  <rect x="104" y="360" width="150" height="38" rx="19" fill="url(#pill)" />
  <text x="130" y="385" fill="#ffffff" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Join Call</text>

  <!-- Stat row: ticketing + IT support -->
  <rect x="84" y="430" width="206" height="170" rx="22" fill="#132a56" />
  <text x="104" y="463" fill="#f4e2b8" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">Tickets</text>
  <text x="104" y="540" fill="#ffffff" font-size="60" font-family="Inter, Arial, sans-serif" font-weight="800">5</text>
  <text x="104" y="575" fill="#d6ddec" font-size="15" font-family="Inter, Arial, sans-serif">open now</text>

  <rect x="310" y="430" width="206" height="170" rx="22" fill="#b8860b" />
  <text x="330" y="463" fill="#0a1f44" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">IT Support</text>
  <circle cx="338" cy="515" r="7" fill="#1f9d55" />
  <text x="354" y="522" fill="#ffffff" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="800">Online</text>
  <text x="330" y="575" fill="#fbf3e0" font-size="14" font-family="Inter, Arial, sans-serif">avg reply 2m</text>

  <!-- In-app bottom tab bar: Home / Bookings / Tickets / Profile -->
  <line x1="84" y1="628" x2="516" y2="628" stroke="#d6ddec" stroke-width="3" />
  <polygon points="140,648 118,668 128,668 128,680 152,680 152,668 162,668" fill="#b8860b" />
  <text x="140" y="698" fill="#132a56" font-size="12" font-family="Inter, Arial, sans-serif" text-anchor="middle">Home</text>
  <rect x="312" y="648" width="36" height="30" rx="4" fill="none" stroke="#132a56" stroke-width="4" />
  <line x1="312" y1="658" x2="348" y2="658" stroke="#132a56" stroke-width="3" />
  <text x="330" y="698" fill="#132a56" font-size="12" font-family="Inter, Arial, sans-serif" text-anchor="middle">Bookings</text>
  <rect x="402" y="650" width="40" height="28" rx="8" fill="none" stroke="#132a56" stroke-width="4" />
  <circle cx="402" cy="664" r="4" fill="#eef1f7" stroke="#132a56" stroke-width="3" />
  <circle cx="442" cy="664" r="4" fill="#eef1f7" stroke="#132a56" stroke-width="3" />
  <text x="422" y="698" fill="#132a56" font-size="12" font-family="Inter, Arial, sans-serif" text-anchor="middle">Tickets</text>
  <circle cx="490" cy="660" r="12" fill="none" stroke="#132a56" stroke-width="4" />
  <path d="M472 688 q18 -20 36 0" stroke="#132a56" stroke-width="4" fill="none" stroke-linecap="round" />
  <text x="490" y="708" fill="#132a56" font-size="12" font-family="Inter, Arial, sans-serif" text-anchor="middle">Profile</text>

  <!-- Home indicator: iOS gesture bar (no soft-key buttons on iOS) -->
  <rect x="270" y="815" width="60" height="7" rx="3.5" fill="#132a56" fill-opacity="0.4" />

  <!-- Soft shadow cast by the front phone -->
  <rect x="480" y="140" width="470" height="796" rx="82" fill="#000000" fill-opacity="0.22" />

  <!-- ===================== Phone B (front / right): conference call + support ===================== -->
  <rect x="470" y="126" width="470" height="796" rx="82" fill="#0a1f44" stroke="#d6ddec" stroke-opacity="0.48" stroke-width="8" />
  <rect x="493" y="176" width="424" height="698" rx="44" fill="url(#screen)" />

  <rect x="660" y="140" width="90" height="24" rx="12" fill="#000000" />
  <text x="513" y="228" fill="#132a56" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">9:41</text>
  <rect x="855" y="218" width="6" height="12" rx="2" fill="#132a56" />
  <rect x="864" y="213" width="6" height="17" rx="2" fill="#132a56" />
  <rect x="873" y="208" width="6" height="22" rx="2" fill="#132a56" />
  <path d="M888 228 q12 -18 24 0" stroke="#132a56" stroke-width="4" fill="none" stroke-linecap="round" />
  <rect x="918" y="212" width="30" height="16" rx="4" fill="none" stroke="#132a56" stroke-width="3" />
  <rect x="921" y="215" width="22" height="10" rx="2" fill="#132a56" />
  <rect x="950" y="217" width="4" height="7" rx="2" fill="#132a56" />

  <path d="M513 261 l-14 14 l14 14" stroke="#132a56" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="540" y="280" fill="#132a56" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Conference Call</text>

  <!-- Live video call card -->
  <rect x="513" y="296" width="384" height="230" rx="28" fill="#132a56" />
  <circle cx="705" cy="411" r="42" fill="url(#pill)" />
  <text x="705" y="424" fill="#0a1f44" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">BH</text>
  <text x="545" y="476" fill="#ffffff" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">B. Herger &#8212; Partner</text>
  <text x="545" y="501" fill="#d6ddec" font-size="15" font-family="Inter, Arial, sans-serif">Case: Apex Marine Ltd</text>

  <!-- Call control row -->
  <circle cx="595" cy="571" r="28" fill="none" stroke="#132a56" stroke-width="5" />
  <rect x="589" y="557" width="12" height="20" rx="6" fill="#132a56" />
  <circle cx="705" cy="571" r="28" fill="none" stroke="#132a56" stroke-width="5" />
  <polygon points="697,561 697,581 715,571" fill="#132a56" />
  <circle cx="815" cy="571" r="28" fill="url(#pill)" />
  <circle cx="815" cy="571" r="9" fill="#ffffff" />

  <!-- Support ticket card -->
  <rect x="513" y="621" width="384" height="92" rx="22" fill="#ffffff" stroke="#d6ddec" stroke-width="2" />
  <text x="533" y="653" fill="#132a56" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700">Ticket #4821</text>
  <text x="533" y="676" fill="#5a77b3" font-size="13" font-family="Inter, Arial, sans-serif">Signature delay &#8212; Apex Marine</text>
  <rect x="533" y="686" width="90" height="26" rx="13" fill="#f4e2b8" />
  <text x="550" y="704" fill="#132a56" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Open</text>

  <!-- IT support card -->
  <rect x="513" y="725" width="384" height="92" rx="22" fill="#132a56" />
  <circle cx="548" cy="771" r="18" fill="url(#pill)" />
  <text x="580" y="766" fill="#f4e2b8" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700">IT Support</text>
  <text x="580" y="792" fill="#d6ddec" font-size="14" font-family="Inter, Arial, sans-serif">How can we help today?</text>

  <!-- Home indicator: iOS gesture bar -->
  <rect x="675" y="845" width="60" height="7" rx="3.5" fill="#132a56" fill-opacity="0.4" />
</svg>
