<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2160" role="img" aria-labelledby="title desc">
  <title id="title">iOS smart cases preview</title>
  <desc id="desc">An iOS style app interface for matter tracking, meeting cards and client communication.</desc>
  <defs>
